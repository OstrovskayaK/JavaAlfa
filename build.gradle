plugins {
    id 'java'
}

group = 'ru.alfabank'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Source: https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
    implementation("org.junit.jupiter:junit-jupiter-api:6.1.3")
    // Source: https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter
    testImplementation("org.junit.jupiter:junit-jupiter:6.1.3")
    // Source: https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-engine
    testImplementation("org.junit.jupiter:junit-jupiter-engine:6.1.3")


    implementation("net.datafaker:datafaker:2.5.4")
    implementation("com.github.lalyos:jfiglet:0.0.8")

    implementation("com.codeborne:selenide:7.18.1")
    // Source: https://mvnrepository.com/artifact/com.codeborne/selenide-core
    implementation("com.codeborne:selenide-core:7.18.1")
    // Source: https://mvnrepository.com/artifact/com.codeborne/selenide-proxy
    implementation("com.codeborne:selenide-proxy:7.18.1")

// Source: https://mvnrepository.com/artifact/io.cucumber/cucumber-junit-platform-engine
    testImplementation("io.cucumber:cucumber-junit-platform-engine:7.34.8")
// Source: https://mvnrepository.com/artifact/io.cucumber/cucumber-java
    implementation("io.cucumber:cucumber-java:7.34.8")
    // Source: https://mvnrepository.com/artifact/io.cucumber/cucumber-core
    implementation("io.cucumber:cucumber-core:7.34.8")
// Source: https://mvnrepository.com/artifact/org.junit.platform/junit-platform-suite-commons
    runtimeOnly("org.junit.platform:junit-platform-suite-commons:6.0.0-M1")
// Source: https://mvnrepository.com/artifact/org.junit.platform/junit-platform-suite-api
    testImplementation("org.junit.platform:junit-platform-suite-api:6.1.3")
}

test {
    useJUnitPlatform()
}